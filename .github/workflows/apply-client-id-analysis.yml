name: Apply ClientID analysis

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply ClientID update
        run: python scripts/apply_client_id_analysis.py
      - name: Check JavaScript syntax
        run: node --check assets/app-v2.js
      - name: Check ClientID recognition and aggregation
        run: |
          grep -q "clientId: \['client id'" assets/app-v2.js
          grep -q "const clientIdSource = state.ipMap?.clientId ? 'ip'" assets/app-v2.js
          grep -q "clientIds: new Map()" assets/app-v2.js
          grep -q "function addClientId" assets/app-v2.js
          grep -q "function topShare" assets/app-v2.js
          grep -q "top10ClientShare" assets/app-v2.js
      - name: Check ClientID scoring safeguards
        run: |
          grep -q "data.clientIdCoverage >= .5" assets/app-v2.js
          grep -q "clientPeers.length >= 6" assets/app-v2.js
          grep -q "score += Math.min(28, clientIdScore)" assets/app-v2.js
          grep -q "один ClientID дал" assets/app-v2.js
          grep -q "аномально много повторов" assets/app-v2.js
      - name: Check interface and export
        run: |
          grep -q "ClientID за период" assets/app-v2.js
          grep -q "ClientID: уник. / топ-1" assets/app-v2.js
          grep -q "Уникальные ClientID" assets/app-v2.js
          grep -q "IP + ClientID" index.html
          grep -q "Что умеет версия 0.4" README.md
      - name: Commit application files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-v2.js index.html README.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add ClientID signals to fraud analysis"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Comment result
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body "ClientID подключён к совокупному анализу: концентрация топ-1 и топ-10, визиты на ClientID и дневные отклонения относительно медианы площадки. Если ClientID есть в обеих выгрузках, используется IP-файл, чтобы не удваивать визиты."
