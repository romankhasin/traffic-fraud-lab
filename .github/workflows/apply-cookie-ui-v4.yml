name: Apply cookie UI v4

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply migration
        run: python scripts/apply_cookie_ui_v4.py

      - name: Validate JavaScript and UI
        run: |
          node --check assets/api-mode.js
          node --check scripts/validate_cookie_methodology.js
          node scripts/validate_api_runtime.js
          node scripts/validate_mi_extensions.js
          node scripts/validate_cookie_methodology.js
          grep -q "renderCookieClientTable" assets/api-mode.js
          grep -q "Качество технических данных и поведение" assets/api-mode.js
          grep -q "Пересечения технических признаков" assets/api-mode.js
          grep -q "Cookie methodology v4" assets/api.css

      - name: Restore temporary migration files
        run: |
          git checkout HEAD -- .github/workflows/apply-cookie-ui-v4.yml
          git checkout HEAD -- scripts/apply_cookie_ui_v4.py
          git checkout HEAD -- scripts/.cookie-ui-v4-trigger

      - name: Commit final files to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Show cookie-segmented ClientID and technical behavior"
            git push origin HEAD:${{ github.head_ref }}
          fi
