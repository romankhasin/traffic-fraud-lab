name: Apply analyst explanations

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply migration
        run: python scripts/apply_analyst_explanations.py

      - name: Validate JavaScript and integration
        run: |
          node --check assets/app-v2.js
          grep -q "function renderScoreBreakdown" assets/app-v2.js
          grep -q "Причина → следствие → вывод" assets/app-v2.js
          grep -q "scoreBreakdown" assets/app-v2.js
          grep -q "Основа итоговой оценки" assets/app-v2.js

      - name: Remove temporary migration files
        run: |
          git rm scripts/apply_analyst_explanations.py
          git rm .github/workflows/apply-analyst-explanations.yml

      - name: Commit final files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Expand fraud explanations and expose score breakdown"
            git push origin HEAD:${{ github.head_ref }}
          fi
