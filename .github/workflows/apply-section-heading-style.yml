name: Apply section heading style

on:
  pull_request:
    paths:
      - "scripts/apply_section_heading_style.py"
      - "scripts/.section-heading-style-trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply visual change
        run: python scripts/apply_section_heading_style.py

      - name: Validate CSS marker
        run: grep -q "metric-section-heading" assets/api.css

      - name: Restore temporary files
        run: |
          git checkout HEAD -- scripts/apply_section_heading_style.py
          git checkout HEAD -- scripts/.section-heading-style-trigger

      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/api.css assets/api-mode.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Emphasize period and daily peak headings"
            git push origin HEAD:${{ github.head_ref }}
          fi
