name: Apply time anomaly and PDF export

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply update
        run: python scripts/apply_time_pdf_update.py
      - name: Validate JavaScript
        run: |
          node --check assets/app-v2.js
          node --check assets/pdf-export.js
      - name: Validate time anomaly logic
        run: |
          grep -q "enoughTimeHistory" assets/app-v2.js
          grep -q "timeSample.length >= 6" assets/app-v2.js
          grep -q "timeRatio <= .45" assets/app-v2.js
          grep -q "timeZ >= 3.5" assets/app-v2.js
          ! grep -q "очень короткое время за период" assets/app-v2.js
          ! grep -q "короткое время за период" assets/app-v2.js
      - name: Validate PDF export
        run: |
          grep -q "pdf-export-button" index.html
          grep -q "pdf-scope-selected" index.html
          grep -q "assets/pdf-export.js" index.html
          grep -q "assets/pdf.css" index.html
          grep -q "html2canvas" index.html
          grep -q "jspdf" index.html
          grep -q "function selectedCards" assets/pdf-export.js
          grep -q "async function exportPdf" assets/pdf-export.js
      - name: Commit application files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/app-v2.js README.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Strengthen time anomaly and add selective PDF export"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Comment result
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body "Среднее время теперь влияет на score только при сильной просадке относительно медианы дней площадки, высокой robust-аномалии и достаточной выборке. Добавлен локальный PDF-экспорт по всем, одной или нескольким площадкам."
