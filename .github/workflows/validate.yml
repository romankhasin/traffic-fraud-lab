name: Validate static app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check assets/app-v2.js
          node --check assets/api-mode.js
          node --check scripts/validate_api_runtime.js

      - name: Run API analysis runtime test
        run: node scripts/validate_api_runtime.js

      - name: Check visit-risk UI integration
        run: |
          grep -q "function aggregateVisitRisk" assets/app-v2.js
          grep -q "visitRisk: aggregateVisitRisk(rows)" assets/app-v2.js
          grep -q "day.visitRisk" assets/app-v2.js
          grep -q "Подозрительные визиты" assets/app-v2.js
          grep -q "Оценка конкретных визитов" assets/app-v2.js
          grep -q "VisitID высокий риск" assets/app-v2.js
          grep -q "Сумма подозрительных VisitID" index.html
          grep -q "Что умеет версия 0.7" README.md
          grep -q "один раз в итоговом количестве" README.md
          test ! -f scripts/apply_visit_risk_ui.py
          test ! -f .github/workflows/apply-visit-risk-ui.yml
          test ! -f scripts/.visit-risk-ui-trigger

      - name: Check API controls and campaign filter
        run: |
          test -f assets/api.css
          test -f assets/api-mode.js
          test -f scripts/validate_api_runtime.js
          grep -q "api-counter-list" index.html
          grep -q "api-date-from" index.html
          grep -q "api-date-to" index.html
          grep -q "api-analyze-button" index.html
          grep -q "analyzeApiRows" assets/app-v2.js
          grep -q "campaignFilterLabel" assets/api-mode.js
          grep -q "catalog?.campaignFilter" assets/api-mode.js
          grep -Fq "['prg', 'med', 'mrk']" assets/api-mode.js
          grep -q "В анализ входят только кампании" assets/api-mode.js
          grep -Fq 'campaign ${campaignFilterLabel()}' assets/api-mode.js
          grep -q "function scoreDailyDays" assets/app-v2.js
          grep -q "подозрительно низкие отказы" assets/app-v2.js
          grep -q "подозрительно высокое среднее время" assets/app-v2.js
          grep -q "score += Math.min(28, clientIdScore)" assets/app-v2.js
          grep -q "const MIN_SOURCE_VISITS = 20" assets/app-v2.js
          grep -q "if (kind === 'tech') coerceClientIdsToText(rows, map)" assets/app-v2.js
          ! grep -q "pdf-export-button" index.html
