name: Validate static app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply text-safe CSV parser
        run: python scripts/apply_csv_text_parser.py
      - name: Check JavaScript syntax
        run: node --check assets/app-v2.js
      - name: Check CSV text reading
        run: |
          grep -q "function parseCsvRows" assets/app-v2.js
          grep -q "rows = parseCsvRows(await file.text())" assets/app-v2.js
          grep -q "String(cells\[index\] ?? '')" assets/app-v2.js
          grep -q "raw: false" assets/app-v2.js
      - name: Check source threshold remains active
        run: |
          grep -q "const MIN_SOURCE_VISITS = 20" assets/app-v2.js
          grep -q "item.visits >= MIN_SOURCE_VISITS" assets/app-v2.js
          grep -q "item.visits < MIN_SOURCE_VISITS" assets/app-v2.js
          grep -q "суммарным объёмом менее 20 визитов" README.md
      - name: Check existing analysis
        run: |
          grep -q "function scoreDailyDays" assets/app-v2.js
          grep -q "score += Math.min(28, clientIdScore)" assets/app-v2.js
          grep -q "подозрительно низкие отказы" assets/app-v2.js
          grep -q "подозрительно высокое среднее время" assets/app-v2.js
          ! grep -q "pdf-export-button" index.html
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-v2.js
          if ! git diff --cached --quiet; then
            git commit -m "Preserve ClientID strings in CSV uploads"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
