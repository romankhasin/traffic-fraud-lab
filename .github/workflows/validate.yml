name: Validate static app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: node --check assets/app-v2.js
      - name: Check required files and analysis logic
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f assets/daily.css
          test -f assets/app-v2.js
          test ! -f assets/pdf.css
          test ! -f assets/pdf-export.js
          grep -q "assets/styles.css" index.html
          grep -q "assets/daily.css" index.html
          grep -q "assets/app-v2.js" index.html
          grep -q "monthly-table" index.html
          ! grep -q "Все дневные срезы" index.html
          ! grep -q "class=\"daily-table\"" index.html
          grep -q "class=\"daily-detail\"" assets/app-v2.js
          grep -q "const dailyRows = row.anomalousDays.length" assets/app-v2.js
          grep -q "function scoreDailyDays" assets/app-v2.js
          grep -q "const days = scoreDailyDays(source)" assets/app-v2.js
          grep -q "state.dailyResults = state.results.flatMap" assets/app-v2.js
          grep -q "enoughTimeHistory" assets/app-v2.js
          grep -q "timeSample.length >= 6" assets/app-v2.js
          grep -q "timeRatio <= .45" assets/app-v2.js
          grep -q "timeZ >= 3.5" assets/app-v2.js
          grep -q "bounceDrop >= .2" assets/app-v2.js
          grep -q "подозрительно низкие отказы" assets/app-v2.js
          grep -q "day.metrics.time >= 600" assets/app-v2.js
          grep -q "timeRatio >= 3" assets/app-v2.js
          grep -q "подозрительно высокое среднее время" assets/app-v2.js
          ! grep -q "аномально низкий отказ за период" assets/app-v2.js
          ! grep -q "pdf-export-button" index.html
          ! grep -q "assets/pdf.css" index.html
          ! grep -q "assets/pdf-export.js" index.html
          ! grep -q "html2canvas" index.html
          ! grep -q "jspdf" index.html
