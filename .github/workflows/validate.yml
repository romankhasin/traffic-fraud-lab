name: Apply and validate MI antifraud UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate.yml"
      - "scripts/apply_mi_stages_1_2.py"
      - "scripts/apply_mi_ui_a.py"
      - "scripts/apply_mi_ui_b.py"
      - "scripts/apply_mi_ui_c.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply pending MI migration
        run: |
          if [ -f scripts/apply_mi_ui_a.py ]; then python scripts/apply_mi_ui_a.py; fi
          if [ -f scripts/apply_mi_ui_b.py ]; then python scripts/apply_mi_ui_b.py; fi
          if [ -f scripts/apply_mi_ui_c.py ]; then python scripts/apply_mi_ui_c.py; fi

      - name: Check JavaScript syntax
        run: |
          node --check assets/app-v2.js
          node --check assets/api-mode.js
          node --check scripts/validate_api_runtime.js
          node --check scripts/validate_clientid_representative.js
          node --check scripts/validate_mi_extensions.js

      - name: Run API runtime tests
        run: |
          node scripts/validate_api_runtime.js
          node scripts/validate_clientid_representative.js
          node scripts/validate_mi_extensions.js

      - name: Check MI features
        run: |
          grep -q "function aggregateSliceGroups" assets/api-mode.js
          grep -q "function buildWarningModel" assets/api-mode.js
          grep -q "Отклонения относительно baseline" assets/api-mode.js
          grep -q "Браузер → разрешение → технический слепок" assets/api-mode.js
          grep -q "Referrer-домены и модели устройств" assets/api-mode.js
          grep -q "Поведенческие паттерны" assets/api-mode.js
          grep -q "Качество технических данных" assets/api-mode.js
          grep -q "mi-warning-table" assets/api.css

      - name: Commit applied files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No UI migration changes"
          else
            git commit -m "Add MI baseline warnings and drill-down diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
