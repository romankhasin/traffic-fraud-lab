name: Validate static app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply ClientID text and source filter update
        run: python scripts/apply_clientid_text_source_filter.py
      - name: Check JavaScript syntax
        run: node --check assets/app-v2.js
      - name: Check existing analysis logic
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f assets/daily.css
          test -f assets/app-v2.js
          test ! -f assets/pdf.css
          test ! -f assets/pdf-export.js
          grep -q "class=\"daily-detail\"" assets/app-v2.js
          grep -q "function scoreDailyDays" assets/app-v2.js
          grep -q "state.dailyResults = state.results.flatMap" assets/app-v2.js
          grep -q "подозрительно низкие отказы" assets/app-v2.js
          grep -q "подозрительно высокое среднее время" assets/app-v2.js
          grep -q "clientIds: new Map()" assets/app-v2.js
          grep -q "score += Math.min(28, clientIdScore)" assets/app-v2.js
      - name: Check ClientID text parsing
        run: |
          grep -q "cellDates: true, raw: true" assets/app-v2.js
          grep -q "function coerceClientIdsToText" assets/app-v2.js
          grep -q "String(value).trim()" assets/app-v2.js
          grep -q "coerceClientIdsToText(rows, map)" assets/app-v2.js
          grep -q "идентификатор читается как текст" index.html
      - name: Check minimum source volume filter
        run: |
          grep -q "const MIN_SOURCE_VISITS = 20" assets/app-v2.js
          grep -q "item.visits >= MIN_SOURCE_VISITS" assets/app-v2.js
          grep -q "item.visits < MIN_SOURCE_VISITS" assets/app-v2.js
          grep -q "менее чем 20 визитами за период исключаются" index.html
          grep -q "суммарным объёмом менее 20 визитов" README.md
          grep -q "MVP 0.5" index.html
          grep -q "Что умеет версия 0.5" README.md
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-v2.js index.html README.md
          if ! git diff --cached --quiet; then
            git commit -m "Read ClientID as text and exclude tiny sources"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
