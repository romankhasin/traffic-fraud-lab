name: Validate static app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: node --check assets/app-v2.js
      - name: Check required files and analysis logic
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f assets/daily.css
          test -f assets/app-v2.js
          test ! -f assets/pdf.css
          test ! -f assets/pdf-export.js
          grep -q "assets/styles.css" index.html
          grep -q "assets/daily.css" index.html
          grep -q "assets/app-v2.js" index.html
          grep -q "monthly-table" index.html
          ! grep -q "Все дневные срезы" index.html
          ! grep -q "class=\"daily-table\"" index.html
          grep -q "class=\"daily-detail\"" assets/app-v2.js
          grep -q "const dailyRows = row.anomalousDays.length" assets/app-v2.js
          grep -q "function scoreDailyDays" assets/app-v2.js
          grep -q "const days = scoreDailyDays(source)" assets/app-v2.js
          grep -q "state.dailyResults = state.results.flatMap" assets/app-v2.js
          grep -q "enoughTimeHistory" assets/app-v2.js
          grep -q "timeSample.length >= 6" assets/app-v2.js
          grep -q "timeRatio <= .45" assets/app-v2.js
          grep -q "timeZ >= 3.5" assets/app-v2.js
          grep -q "bounceDrop >= .2" assets/app-v2.js
          grep -q "подозрительно низкие отказы" assets/app-v2.js
          grep -q "day.metrics.time >= 600" assets/app-v2.js
          grep -q "timeRatio >= 3" assets/app-v2.js
          grep -q "подозрительно высокое среднее время" assets/app-v2.js
          ! grep -q "аномально низкий отказ за период" assets/app-v2.js
          ! grep -q "pdf-export-button" index.html
          ! grep -q "assets/pdf.css" index.html
          ! grep -q "assets/pdf-export.js" index.html
          ! grep -q "html2canvas" index.html
          ! grep -q "jspdf" index.html
      - name: Check ClientID analysis
        run: |
          grep -q "clientId: \['client id'" assets/app-v2.js
          grep -q "const clientIdSource = state.ipMap?.clientId ? 'ip'" assets/app-v2.js
          grep -q "clientIds: new Map()" assets/app-v2.js
          grep -q "function addClientId" assets/app-v2.js
          grep -q "function topShare" assets/app-v2.js
          grep -q "top10ClientShare" assets/app-v2.js
          grep -q "data.clientIdCoverage >= .5" assets/app-v2.js
          grep -q "clientPeers.length >= 6" assets/app-v2.js
          grep -q "score += Math.min(28, clientIdScore)" assets/app-v2.js
          grep -q "ClientID за период" assets/app-v2.js
          grep -q "ClientID: уник. / топ-1" assets/app-v2.js
          grep -q "Уникальные ClientID" assets/app-v2.js
          grep -q "IP + ClientID" index.html
          grep -q "ClientID не отправляются на сервер" index.html
      - name: Check ClientID text parsing and source filter
        run: |
          grep -q "cellDates: true, raw: true" assets/app-v2.js
          grep -q "function coerceClientIdsToText" assets/app-v2.js
          grep -q "String(value).trim()" assets/app-v2.js
          grep -q "coerceClientIdsToText(rows, map)" assets/app-v2.js
          grep -q "const MIN_SOURCE_VISITS = 20" assets/app-v2.js
          grep -q "item.visits >= MIN_SOURCE_VISITS" assets/app-v2.js
          grep -q "item.visits < MIN_SOURCE_VISITS" assets/app-v2.js
          grep -q "менее чем 20 визитами за период исключаются" index.html
          grep -q "суммарным объёмом менее 20 визитов" README.md
          grep -q "MVP 0.5" index.html
          grep -q "Что умеет версия 0.5" README.md
