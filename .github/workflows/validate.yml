name: Validate static app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check assets/app-v2.js
          node --check assets/api-mode.js
          node --check scripts/validate_api_runtime.js

      - name: Run API analysis runtime test
        run: node scripts/validate_api_runtime.js

      - name: Check API controls and integration
        run: |
          test -f assets/api.css
          test -f assets/api-mode.js
          test -f scripts/validate_api_runtime.js
          test ! -f scripts/apply_api_mode.py
          test ! -f scripts/patch_api_daily_labels.py
          grep -q "api-counter-list" index.html
          grep -q "api-date-from" index.html
          grep -q "api-date-to" index.html
          grep -q "api-analyze-button" index.html
          grep -q "assets/api-mode.js" index.html
          grep -q "assets/api.css" index.html
          grep -q "function buildApiSources" assets/app-v2.js
          grep -q "function aggregateApiSnapshots" assets/app-v2.js
          grep -q "analyzeApiRows" assets/app-v2.js
          grep -q "precomputedSnapshot" assets/app-v2.js
          grep -q "concentrationScope !== 'daily'" assets/app-v2.js
          grep -q "ClientID — дневные максимумы" assets/app-v2.js
          grep -q "Макс. уникальных за день" assets/app-v2.js
          grep -q "raw.githubusercontent.com/romankhasin/-level-group-dashboard/main/data/fraud" assets/api-mode.js
          grep -q "Logs API без лимита строк" index.html
          grep -q "Что умеет версия 0.6" README.md

      - name: Check existing fraud rules
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f assets/daily.css
          test ! -f assets/pdf.css
          test ! -f assets/pdf-export.js
          grep -q "function scoreDailyDays" assets/app-v2.js
          grep -q "подозрительно низкие отказы" assets/app-v2.js
          grep -q "подозрительно высокое среднее время" assets/app-v2.js
          grep -q "score += Math.min(28, clientIdScore)" assets/app-v2.js
          grep -q "const MIN_SOURCE_VISITS = 20" assets/app-v2.js
          grep -q "if (kind === 'tech') coerceClientIdsToText(rows, map)" assets/app-v2.js
          ! grep -q "pdf-export-button" index.html
