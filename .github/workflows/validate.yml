name: Validate static app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: node --check assets/app-v2.js
      - name: Check required files and analysis logic
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f assets/daily.css
          test -f assets/app-v2.js
          grep -q "assets/styles.css" index.html
          grep -q "assets/daily.css" index.html
          grep -q "assets/app-v2.js" index.html
          grep -q "monthly-table" index.html
          ! grep -q "Все дневные срезы" index.html
          ! grep -q "class=\"daily-table\"" index.html
          ! grep -q "class=\"daily-detail\"" assets/app-v2.js
          grep -q "function scoreDailyDays" assets/app-v2.js
          grep -q "const days = scoreDailyDays(source)" assets/app-v2.js
          grep -q "state.dailyResults = state.results.flatMap" assets/app-v2.js
