name: Validate static app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply ClientID technical-only update
        run: python scripts/apply_clientid_tech_only.py
      - name: Check JavaScript syntax
        run: node --check assets/app-v2.js
      - name: Check ClientID source
        run: |
          grep -q "if (kind === 'tech') coerceClientIdsToText(rows, map)" assets/app-v2.js
          grep -q "function addTechRow(target, row, map)" assets/app-v2.js
          grep -q "addClientId(target, row, map, visits)" assets/app-v2.js
          grep -q "function addIpRow(target, row, map)" assets/app-v2.js
          ! grep -q "clientIdSource" assets/app-v2.js
          ! grep -q "addIpRow(target, row, map, includeClientId" assets/app-v2.js
          grep -q "clientIdVisits / tech.visits" assets/app-v2.js
      - name: Check interface and documentation
        run: |
          grep -q "Дата + источник + IP</h3>" index.html
          grep -q "ClientID в этой выгрузке не требуется" index.html
          grep -q "Дата + источник + техника + ClientID" index.html
          grep -q "учитывается только из этого файла" index.html
          grep -q "ClientID в IP-выгрузке не требуется" README.md
          grep -q "ClientID берётся только из технической выгрузки" README.md
          grep -q "Покрытие ClientID рассчитывается как доля технических визитов" README.md
      - name: Check existing safeguards
        run: |
          grep -q "function parseCsvRows" assets/app-v2.js
          grep -q "const MIN_SOURCE_VISITS = 20" assets/app-v2.js
          grep -q "score += Math.min(28, clientIdScore)" assets/app-v2.js
          grep -q "подозрительно низкие отказы" assets/app-v2.js
          grep -q "подозрительно высокое среднее время" assets/app-v2.js
          ! grep -q "pdf-export-button" index.html
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-v2.js index.html README.md
          if ! git diff --cached --quiet; then
            git commit -m "Use ClientID only from technical export"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
