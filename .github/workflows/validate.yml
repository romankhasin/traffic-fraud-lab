name: Validate static app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: node --check assets/app-v2.js
      - name: Check required files and analysis logic
        run: |
          test -f index.html
          test -f assets/styles.css
          test -f assets/daily.css
          test -f assets/app-v2.js
          test ! -f assets/pdf.css
          test ! -f assets/pdf-export.js
          test ! -f scripts/apply_csv_text_parser.py
          test ! -f scripts/apply_clientid_tech_only.py
          grep -q "assets/styles.css" index.html
          grep -q "assets/daily.css" index.html
          grep -q "assets/app-v2.js" index.html
          grep -q "monthly-table" index.html
          ! grep -q "Все дневные срезы" index.html
          ! grep -q "class=\"daily-table\"" index.html
          grep -q "class=\"daily-detail\"" assets/app-v2.js
          grep -q "function scoreDailyDays" assets/app-v2.js
          grep -q "state.dailyResults = state.results.flatMap" assets/app-v2.js
          grep -q "подозрительно низкие отказы" assets/app-v2.js
          grep -q "подозрительно высокое среднее время" assets/app-v2.js
          ! grep -q "pdf-export-button" index.html
      - name: Check ClientID technical-only analysis
        run: |
          grep -q "clientId: \['client id'" assets/app-v2.js
          grep -q "if (kind === 'tech') coerceClientIdsToText(rows, map)" assets/app-v2.js
          grep -q "? \['date','source','ip','visits'" assets/app-v2.js
          grep -q ": \['date','source','clientId','visits'" assets/app-v2.js
          grep -q "function addTechRow(target, row, map)" assets/app-v2.js
          grep -q "addClientId(target, row, map, visits)" assets/app-v2.js
          grep -q "function addIpRow(target, row, map)" assets/app-v2.js
          ! grep -q "clientIdSource" assets/app-v2.js
          ! grep -q "addIpRow(target, row, map, includeClientId" assets/app-v2.js
          grep -q "clientIdVisits / tech.visits" assets/app-v2.js
          grep -q "ClientID найден в технической выгрузке" assets/app-v2.js
          grep -q "ClientID в технической выгрузке не найден" assets/app-v2.js
          grep -q "Дата + источник + IP</h3>" index.html
          grep -q "ClientID в этой выгрузке не требуется" index.html
          grep -q "Дата + источник + техника + ClientID" index.html
          grep -q "учитывается только из этого файла" index.html
          grep -q "ClientID в IP-выгрузке не требуется" README.md
          grep -q "ClientID берётся только из технической выгрузки" README.md
          grep -q "Покрытие ClientID рассчитывается как доля технических визитов" README.md
      - name: Check ClientID text parsing and source filter
        run: |
          grep -q "function parseCsvRows" assets/app-v2.js
          grep -q "rows = parseCsvRows(await file.text())" assets/app-v2.js
          grep -q "String(cells\[index\] ?? '')" assets/app-v2.js
          grep -q "raw: false" assets/app-v2.js
          grep -q "const MIN_SOURCE_VISITS = 20" assets/app-v2.js
          grep -q "item.visits >= MIN_SOURCE_VISITS" assets/app-v2.js
          grep -q "item.visits < MIN_SOURCE_VISITS" assets/app-v2.js
          grep -q "score += Math.min(28, clientIdScore)" assets/app-v2.js
          grep -q "менее чем 20 визитами за период исключаются" index.html
          grep -q "суммарным объёмом менее 20 визитов" README.md
