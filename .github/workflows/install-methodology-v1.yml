name: Install independent fraud methodology

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-methodology-v1.yml
      - methodology-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install methodology module
        shell: bash
        run: |
          cat > /tmp/methodology-v1.js.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/methodology-v1.js.gz.b64 | gzip -d > assets/methodology-v1.js
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '  <script src="assets/api-mode.js"></script>'
          addition = marker + '\n  <script src="assets/methodology-v1.js"></script>'
          if 'assets/methodology-v1.js' not in text:
              if marker not in text:
                  raise SystemExit('api-mode script marker not found')
              text = text.replace(marker, addition)
              path.write_text(text, encoding='utf-8')
          PY
          node --check assets/methodology-v1.js
      - name: Commit installed module
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/methodology-v1.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Install independent fraud methodology"
          git push
