name: Apply scoring stage 1 UI changes

on:
  push:
    branches:
      - agent/scoring-stage1-ui
    paths:
      - "scripts/apply_scoring_stage1.py"
      - ".github/workflows/apply-scoring-stage1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/scoring-stage1-ui

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply changes
        run: python scripts/apply_scoring_stage1.py

      - name: Validate application
        run: |
          node --check assets/app-v2.js
          node --check assets/api-mode.js
          node --check scripts/validate_api_runtime.js
          node scripts/validate_api_runtime.js
          grep -q 'function automationSignal' assets/app-v2.js
          grep -q 'function capScoreByFamilies' assets/app-v2.js
          grep -q 'automationVisits' assets/app-v2.js
          grep -q 'аномально низкие отказы как слабый подтверждающий сигнал' assets/app-v2.js
          grep -q "addSignal(networkScore, 'network'" assets/app-v2.js
          grep -q 'clientCoverage < .35' assets/app-v2.js
          grep -q 'Что умеет версия 0.8' README.md

      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-v2.js README.md index.html scripts/validate_api_runtime.js .github/workflows/validate.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply scoring model stage 1"
            git push origin HEAD:agent/scoring-stage1-ui
          fi
