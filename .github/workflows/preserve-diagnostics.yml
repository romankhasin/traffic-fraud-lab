name: Preserve detailed diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/preserve-diagnostics.yml
      - preserve-diagnostics-trigger.txt

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update methodology module
        shell: bash
        run: |
          cat > /tmp/methodology-v1.js.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/methodology-v1.js.gz.b64 | gzip -d > assets/methodology-v1.js
          node --check assets/methodology-v1.js
      - name: Commit module update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/methodology-v1.js
          git commit -m "Preserve detailed fraud diagnostics in methodology view"
          git push
