name: Apply two-sided behavior logic

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply update
        run: python scripts/apply_two_sided_behavior.py
      - name: Validate JavaScript
        run: node --check assets/app-v2.js
      - name: Validate two-sided anomalies
        run: |
          grep -q "bounceDrop >= .2" assets/app-v2.js
          grep -q "bounceZ >= 3.5" assets/app-v2.js
          grep -q "подозрительно низкие отказы" assets/app-v2.js
          grep -q "day.metrics.time >= 600" assets/app-v2.js
          grep -q "timeRatio >= 3" assets/app-v2.js
          grep -q "подозрительно высокое среднее время" assets/app-v2.js
          ! grep -q "аномально низкий отказ за период" assets/app-v2.js
      - name: Validate PDF removal
        run: |
          ! grep -q "pdf-export-button" index.html
          ! grep -q "assets/pdf.css" index.html
          ! grep -q "assets/pdf-export.js" index.html
          ! grep -q "html2canvas" index.html
          ! grep -q "jspdf" index.html
          ! grep -q "формирует компактный PDF" README.md
      - name: Commit application files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/app-v2.js README.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Detect two-sided behavior anomalies and remove PDF export"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Comment result
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body "PDF-экспорт удалён. Отказы и среднее время теперь проверяются в обе стороны относительно медианы дней площадки: как ухудшения, так и неправдоподобно хорошие значения."
